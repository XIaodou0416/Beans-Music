name: Beans

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    sources:
      - Beans
    resources:
      - Beans/en.lproj
      - Beans/zh-Hans.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beans.app
        MARKETING_VERSION: "1.6.7"
        CURRENT_PROJECT_VERSION: "6"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Beans Music
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

schemes:
  Beans:
    build:
      targets:
        Beans: all
    run:
      config: Debug
    archive:
      config: Release
