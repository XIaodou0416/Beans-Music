name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否发布 GitHub Release（false = 只构建 IPA 供测试）'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main, codex/build-bilibili-detail-20260924]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install xcodegen

      - name: Resolve build number (手动构建使用 project.yml 中的值，主分支推送仍自动递增)
        id: bump
        run: |
          python3 - <<'PYEOF'
          import re
          import os
          path = 'project.yml'
          with open(path) as f:
              content = f.read()
          def bump_build(m):
              return 'CURRENT_PROJECT_VERSION: "' + str(int(m.group(1)) + 1) + '"'
          if os.environ.get('GITHUB_EVENT_NAME') == 'push':
              content, n2 = re.subn(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', bump_build, content)
          with open(path, 'w') as f:
              f.write(content)
          ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', content).group(1)
          build = re.search(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', content).group(1)
          print('::notice title=Version::Building %s (build %s)' % (ver, build))
          with open('version.txt', 'w') as f:
              f.write(ver)
          with open('build.txt', 'w') as f:
              f.write(build)
          PYEOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Bilibili login and playback parsing
        run: |
          xcrun swiftc Beans/BilibiliProtocol.swift Beans/BilibiliNativeRequestPolicy.swift scripts/check-bilibili-protocol.swift -o /tmp/beans-bilibili-checks
          /tmp/beans-bilibili-checks

      - name: Build (unsigned)
        run: |
          set -o pipefail
          VER=$(cat version.txt)
          BUILD=$(cat build.txt)
          echo "Building with MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$BUILD"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VER" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$VER" >> "$GITHUB_ENV"
          xcodebuild \
            -project Beans.xcodeproj \
            -scheme Beans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Test CiliCili upstream and Beans integration regressions
        run: |
          set -o pipefail
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcodebuild \
            -project Beans.xcodeproj \
            -scheme Beans \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -derivedDataPath build-tests \
            -resultBundlePath BilibiliTests.xcresult \
            -only-testing:BeansTests/BilibiliDetailTests \
            -only-testing:CiliCiliTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee bilibili-tests.log

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Beans-build-diagnostics
          path: |
            xcodebuild.log
            bilibili-tests.log
            BilibiliTests.xcresult

      - name: Verify version in built app
        run: |
          echo "== project.yml =="
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          echo "== built Info.plist =="
          plutil -p build/Build/Products/Release-iphoneos/Beans.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          cp Beans/Resources/CiliCili-LICENSE.txt Payload/Beans.app/
          cp Beans/Resources/CiliCili-NOTICE.md Payload/Beans.app/
          # 使用普通 ZIP，避免将 macOS 资源元数据带入 IPA，提升第三方签名器兼容性。
          zip -qry Beans-unsigned.ipa Payload
          unzip -t Beans-unsigned.ipa
          test -d Payload/Beans.app
          test -f Payload/Beans.app/Info.plist
          test -x Payload/Beans.app/Beans
          test -x Payload/Beans.app/Frameworks/CiliCiliKit.framework/CiliCiliKit

      - name: Package corresponding GPL source
        run: git archive --format=zip --output=Beans-CiliCili-source.zip HEAD

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: Beans-CiliCili-source
          path: Beans-CiliCili-source.zip

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beans-unsigned-ipa
          path: Beans-unsigned.ipa

      - name: Build release notes from CHANGELOG
        run: |
          python3 - <<'PYEOF'
          import re
          ver = open('version.txt').read().strip()
          content = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^##\s+' + re.escape(ver) + r'\s*$([\s\S]*?)(?=^##\s|\Z)', content, re.M)
          body = m.group(1).strip() if m else ('版本 ' + ver + ' 的更新内容。')
          body = '# Beans Music ' + ver + '\n\n' + body + '\n'
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          print(body)
          PYEOF

      - name: Publish Release
        if: success() && github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Beans Music ${{ env.VERSION_LABEL }}
          body_path: release_body.md
          files: Beans-unsigned.ipa
          update_release_body: true
          update_release_name: true
          update_release_assets: true

      - name: Commit version bump back
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "no version change to commit"
          else
            git commit -m "chore: bump build to $(cat version.txt) [skip ci]"
            git push
          fi

