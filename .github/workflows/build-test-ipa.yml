name: Build Test IPA

on:
  push:
    branches: [v134-features, test/qq-wechat-sync-20260830]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project Beans.xcodeproj \
            -scheme Beans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Commit build error summary
        if: failure()
        run: |
          mkdir -p ci-logs
          grep -E "error:|warning:|SwiftCompile|CompileSwift|The following build commands failed" xcodebuild.log > ci-logs/xcodebuild-errors.log || cp xcodebuild.log ci-logs/xcodebuild-errors.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/xcodebuild-errors.log
          git commit -m "ci: capture xcodebuild errors [skip ci]" || exit 0
          git push

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Beans-1.5.2-test.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beans-1.5.2-test-ipa
          path: Beans-1.5.2-test.ipa

      - name: Commit test IPA
        run: |
          mkdir -p ci-builds
          cp Beans-1.5.2-test.ipa ci-builds/Beans-1.5.2-test.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-builds/Beans-1.5.2-test.ipa
          git commit -m "ci: attach test ipa [skip ci]" || exit 0
          git push
